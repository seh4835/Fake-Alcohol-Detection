<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake Alcohol Detection Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .container {
      margin-top: 40px;
    }
    .card {
      box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
      border-radius: 10px;
    }
    .plot-img {
      width: 100%;
      border-radius: 10px;
      transition: transform 0.2s ease;
    }
    .plot-img:hover {
      transform: scale(1.02);
    }
    h2, h4 {
      color: #2c3e50;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="text-center mb-4">🍷 Fake Alcohol Detection Dashboard</h2>
    <h5 class="text-center text-muted mb-4">Best Performing Model: <b>{{ best_model }}</b></h5>

    <div class="text-center mb-4">
      <a href="/results" class="btn btn-success px-4 py-2">View Model Performance Summary</a>
    </div>

    <div class="row">
      {% for img in images %}
      <div class="col-md-4 mb-4">
        <div class="card">
          <img src="{{ url_for('static', filename='plots/' + img) }}" class="plot-img" alt="{{ img }}">
          <div class="card-body text-center">
            <p class="text-muted">{{ img.replace('_', ' ').replace('.png','') }}</p>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
