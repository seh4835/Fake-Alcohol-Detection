<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model Performance Summary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    table {
      margin-top: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-radius: 10px;
      overflow: hidden;
    }
    th {
      background-color: #198754;
      color: white;
      text-align: center;
    }
    td {
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-center mb-4">📋 Model Performance Summary</h2>
    <a href="/" class="btn btn-outline-success mb-3">← Back to Dashboard</a>

    <table class="table table-striped table-bordered align-middle">
      <thead>
        <tr>
          <th>Model</th>
          <th>Accuracy</th>
          <th>Precision</th>
          <th>Recall</th>
          <th>F1-Score</th>
        </tr>
      </thead>
      <tbody>
        {% for r in results %}
        <tr>
          <td>{{ r['Model'] }}</td>
          <td>{{ r['Accuracy'] }}</td>
          <td>{{ r['Precision'] }}</td>
          <td>{{ r['Recall'] }}</td>
          <td>{{ r['F1-Score'] }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
